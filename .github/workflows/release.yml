name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLA Desktop ${{ github.ref_name }}"
          body: "YOLA Desktop ${{ github.ref_name }}. Descargá el instalador para tu sistema operativo desde los artifacts del build."
          draft: false
          prerelease: false

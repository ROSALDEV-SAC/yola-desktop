name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout si-yola
        uses: actions/checkout@v4
        with:
          repository: ROSALDEV-SAC/si-yola
          path: ../si-yola

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build si-yola frontend
        working-directory: ../si-yola
        run: |
          bun install
          bun run build

      - name: Download daemon (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/yola-daemon-win.exe" -o src-tauri/yola-daemon.exe 2>/dev/null || echo "Daemon no disponible en releases — build sin sidecar"

      - name: Download daemon (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/yola-daemon-linux" -o src-tauri/yola-daemon 2>/dev/null || echo "Daemon no disponible en releases"
          chmod +x src-tauri/yola-daemon 2>/dev/null || true

      - name: Download daemon (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/yola-daemon-macos" -o src-tauri/yola-daemon 2>/dev/null || echo "Daemon no disponible en releases"
          chmod +x src-tauri/yola-daemon 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri app
        run: bun run tauri build

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yola-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: yola-desktop-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yola-desktop-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

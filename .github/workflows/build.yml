name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone si-yola
        run: git clone https://github.com/ROSALDEV-SAC/si-yola.git ../si-yola

      - name: Clone yola-client-ts (SDK)
        run: git clone https://github.com/ROSALDEV-SAC/yola-client-ts.git ../yola-client-ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build yola-client-ts SDK
        run: |
          cd ../yola-client-ts
          bun install
          bun run build

      - name: Install dependencies
        run: bun install

      - name: Build si-yola frontend
        run: |
          cd ../si-yola
          bun install
          bun run build

      - name: Download daemon from yola-releases
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/yola-daemon-win.exe" -o src-tauri/yola-daemon.exe 2>$null
          if (-not (Test-Path src-tauri/yola-daemon.exe)) {
            Write-Host "Daemon no disponible en releases — build sin sidecar"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: bun run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yola-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Update latest.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          $content = Get-Content latest.json -Raw | ConvertFrom-Json
          $content.version = $version
          $content.pub_date = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
          $content | ConvertTo-Json -Depth 3 | Set-Content latest.json
        shell: pwsh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLA Desktop ${{ github.ref_name }}"
          body: "YOLA Desktop ${{ github.ref_name }}. Instalador para Windows 10/11 (64-bit). Auto-update via Tauri updater."
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
          draft: false
          prerelease: false

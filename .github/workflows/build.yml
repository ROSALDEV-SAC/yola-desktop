name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone si-yola
        run: git clone https://github.com/ROSALDEV-SAC/si-yola.git ../si-yola

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build si-yola frontend
        run: |
          cd ../si-yola
          bun install
          bun run build

      - name: Download daemon from yola-releases
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/yola-daemon-win.exe" -o src-tauri/yola-daemon.exe 2>$null
          if (-not (Test-Path src-tauri/yola-daemon.exe)) {
            Write-Host "Daemon no disponible en releases — build sin sidecar"
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: bun run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yola-desktop-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

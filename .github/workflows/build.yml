name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            daemon_asset: yola-daemon-win.exe
            daemon_name: yola-daemon.exe
            artifact: yola-desktop-windows
          - os: ubuntu-latest
            daemon_asset: yola-daemon-linux
            daemon_name: yola-daemon
            artifact: yola-desktop-linux
          - os: macos-latest
            daemon_asset: yola-daemon-macos
            daemon_name: yola-daemon
            artifact: yola-desktop-macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone si-yola
        run: git clone https://github.com/ROSALDEV-SAC/si-yola.git ../si-yola

      - name: Clone yola-client-ts (SDK)
        run: git clone https://github.com/ROSALDEV-SAC/yola-client-ts.git ../yola-client-ts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build yola-client-ts SDK
        run: |
          cd ../yola-client-ts
          bun install
          bun run build

      - name: Install dependencies
        run: bun install

      - name: Build si-yola frontend
        run: |
          cd ../si-yola
          bun install
          bun run build

      - name: Download daemon from yola-releases
        run: |
          curl -L "https://github.com/ROSALDEV-SAC/yola-releases/releases/latest/download/${{ matrix.daemon_asset }}" -o "src-tauri/${{ matrix.daemon_name }}" 2>/dev/null || echo "Daemon no disponible en releases"
          if [ -f "src-tauri/${{ matrix.daemon_name }}" ]; then
            chmod +x "src-tauri/${{ matrix.daemon_name }}" 2>/dev/null || true
            echo "Daemon descargado: ${{ matrix.daemon_name }}"
          fi
        shell: bash

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri app
        run: bun run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Update latest.json for auto-update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}" 
          VERSION="${VERSION#v}"
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "YOLA Desktop ${VERSION} — Auto-update activo.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/ROSALDEV-SAC/yola-desktop/releases/download/${{ github.ref_name }}/YOLA_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/ROSALDEV-SAC/yola-desktop/releases/download/${{ github.ref_name }}/YOLA_${VERSION}_amd64.AppImage"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/ROSALDEV-SAC/yola-desktop/releases/download/${{ github.ref_name }}/YOLA_${VERSION}_x64.dmg"
              }
            }
          }
          EOF
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "YOLA Desktop ${{ github.ref_name }}"
          body: "YOLA Desktop ${{ github.ref_name }}. Instaladores para Windows, Linux y macOS."
          files: src-tauri/target/release/bundle/**/*
          draft: false
          prerelease: false
